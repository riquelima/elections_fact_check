name: Build TV Fact Checker APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace
          # Encontra o APK gerado e copia com o nome padronizado oficial
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          cp "$APK_FILE" TVFactChecker_v1.0.9.apk
          ls -lh TVFactChecker_v1.0.9.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVFactChecker_v1.0.9
          path: TVFactChecker_v1.0.9.apk
          if-no-files-found: error

      - name: Create GitHub Release (on main/master)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.9
          name: TV Fact Checker v1.0.9
          body: |
            ## 📺 TV Fact Checker - APK Oficial para Android TV (v1.0.9)
            
            Versão oficial compilada: **TVFactChecker_v1.0.9.apk**
            
            ### 🚀 Novidades da versão 1.0.9:
            - **Print da Tela em Tempo Real (Contexto Multimodal com Visão Computacional):** No momento em que a IA valida a informação ouvida da TV, um print da tela (640x360) é capturado pelo sistema operacional via `MediaProjection` e enviado junto à fala para a IA processar manchetes, tarjas, números, GC (gerador de caracteres) e gráficos da emissora.
            - **Exibição Obrigatória de Cards para Fatos Verdadeiros (`VERDADEIRO`):** O card flutuante agora sempre é projetado na tela para notícias verdadeiras (`🟢 VERDADEIRO` com 9s de exibição), além de notícias falsas (`🔴 FALSO`) e enganosas (`🟡 ENGANOSO`), corrigindo a omissão anterior onde notícias verdadeiras não expandiam o card.
            - **Thread Dedicada de Captura e Zero Sobrecarga de CPU:** A captura de frames roda em thread separada com throttling de 1 frame/s e reciclagem contínua de memória Bitmap, garantindo navegação 100% fluida na TV.
            - **Suporte Total a TV Aberta, GloboNews, uniTV e TV Box.**
            
            ### Como instalar na sua TV / uniTV:
            1. Baixe o arquivo **`TVFactChecker_v1.0.9.apk`** abaixo.
            2. Envie para a TV usando o app **Send Files to TV** ou via pendrive USB.
            3. Instale o APK e abra o aplicativo.
            4. Conceda as permissões de sobreposição de tela, microfone e captura de tela.
            5. Inicie o monitoramento!
          files: TVFactChecker_v1.0.9.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
