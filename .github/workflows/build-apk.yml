name: Build TV Fact Checker APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace
          # Encontra o APK gerado e copia com o nome padronizado oficial
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          cp "$APK_FILE" TVFactChecker_v1.2.1.apk
          ls -lh TVFactChecker_v1.2.1.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVFactChecker_v1.2.1
          path: TVFactChecker_v1.2.1.apk
          if-no-files-found: error

      - name: Create GitHub Release (on main/master)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.1
          name: TV Fact Checker v1.2.1
          body: |
            ## 📺 TV Fact Checker - APK Oficial para Android TV (v1.2.1)
            
            Versão oficial compilada: **TVFactChecker_v1.2.1.apk**
            
            ### 🚀 Novidades da versão 1.2.1:
            - **Interface com Apenas 2 Botões:** Interface simplificada para controle remoto da TV com apenas 2 botões principais:
              1. **1. Conceder Permissões da TV** (autoriza sobreposição sobre apps/canais e microfone).
              2. **2. Iniciar / Parar Monitoramento em Segundo Plano**.
            - **Flag Flutuante Sempre Visível sem Emojis:** A flag ambiente no canto superior direito permanece contínua na tela da TV durante todo o monitoramento com apenas 3 estados de texto limpos:
              1. `Escutando áudio`
              2. `Processando`
              3. `Checando fatos`
            - **Exibição do Card:** Logo após os 3 estados, o card se expande automaticamente com os badges limpos (`VERDADEIRO`, `FALSO`, `ENGANOSO`), texto da afirmação e veredito checado com agências oficiais.
            
            ### Como instalar na sua TV / uniTV:
            1. Baixe o arquivo **`TVFactChecker_v1.2.1.apk`** abaixo.
            2. Envie para a TV usando o app **Send Files to TV** ou via pendrive USB.
            3. Instale o APK e abra o aplicativo.
            4. Conceda as permissões com o Botão 1 e inicie com o Botão 2!
          files: TVFactChecker_v1.2.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
