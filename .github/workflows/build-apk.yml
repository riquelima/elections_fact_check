name: Build TV Fact Checker APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace
          # Encontra o APK gerado e copia com o nome padronizado oficial
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          cp "$APK_FILE" TVFactChecker_v1.0.6.apk
          ls -lh TVFactChecker_v1.0.6.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVFactChecker_v1.0.6
          path: TVFactChecker_v1.0.6.apk
          if-no-files-found: error

      - name: Create GitHub Release (on main/master)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.6
          name: TV Fact Checker v1.0.6
          body: |
            ## 📺 TV Fact Checker - APK Oficial para Android TV (v1.0.6)
            
            Versão oficial compilada: **TVFactChecker_v1.0.6.apk**
            
            ### 🚀 Correções Críticas da versão 1.0.6:
            - **Fim do Travamento Contínuo na GloboNews ("Captando fala da TV sem fim"):** Em telejornais ao vivo sem pausas de silêncio, o reconhecimento de áudio agora corta rigidamente blocos de 4.5 segundos de áudio com chamada forçada de `stopListening()`, gerando a transcrição e checagem imediata sem nunca travar.
            - **Watchdogs de Segurança (3s e 7.5s):** Garantem que se o motor de voz da TV Box/uniTV demorar para responder ou travar, o ciclo é reiniciado automaticamente em milissegundos.
            - **Varredura Automática de Manchetes da TV em 2º Plano:** Além da escuta contínua de áudio, o serviço agora checa automaticamente a cada 35 segundos as manchetes e tarjas (GC) no ar da GloboNews/G1 contra as agências Aos Fatos, Agência Lupa, TSE e STF!
            - **Chave de IA Blindada:** Fallback interno estático garantindo que nenhuma requisição falhe por falta de parâmetros.
            
            ### Como instalar na sua TV / uniTV:
            1. Baixe o arquivo **`TVFactChecker_v1.0.6.apk`** abaixo.
            2. Envie para a TV usando o app **Send Files to TV** ou via pendrive USB.
            3. Instale o APK e abra o aplicativo.
            4. Conceda as permissões de sobreposição de tela e microfone.
            5. Inicie o monitoramento!
          files: TVFactChecker_v1.0.6.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
