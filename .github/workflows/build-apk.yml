name: Build TV Fact Checker APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace
          # Encontra o APK gerado e copia com o nome padronizado oficial
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          cp "$APK_FILE" TVFactChecker_v1.0.8.apk
          ls -lh TVFactChecker_v1.0.8.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVFactChecker_v1.0.8
          path: TVFactChecker_v1.0.8.apk
          if-no-files-found: error

      - name: Create GitHub Release (on main/master)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.8
          name: TV Fact Checker v1.0.8
          body: |
            ## 📺 TV Fact Checker - APK Oficial para Android TV (v1.0.8)
            
            Versão oficial compilada: **TVFactChecker_v1.0.8.apk**
            
            ### 🚀 Evolução da versão 1.0.8 (MiniMax-M3.1-Flash):
            - **Modelo Mais Potente da MiniMax (`MiniMax-M3.1-Flash`):** Atualizado para o modelo de fronteira mais recente, com janela de contexto estendida de **1 milhão de tokens (1M)** e capacidades de raciocínio profundo para checagem em tempo real de política, economia e eleições brasileiras.
            - **Otimização Extrema de Latência (`reasoning_effort: "low"`):** Ajuste fino do esforço de raciocínio da IA para cortar o tempo de resposta em mais de 60%, gerando o veredito quase instantaneamente para exibição na TV ao vivo.
            - **Dual Endpoint com Failover Automático:** Roteamento primário pelo endpoint global OpenAI-compatible (`api.minimax.io`) com contingência automática para `api.minimaxi.chat` caso haja instabilidade de rede na TV.
            - **Parser de Resposta Blindado:** Suporte aos campos separados `reasoning_content` e `content`, com isolamento estrito de JSON e remoção de tags de pensamento.
            
            ### Como instalar na sua TV / uniTV:
            1. Baixe o arquivo **`TVFactChecker_v1.0.8.apk`** abaixo.
            2. Envie para a TV usando o app **Send Files to TV** ou via pendrive USB.
            3. Instale o APK e abra o aplicativo.
            4. Conceda as permissões de sobreposição de tela e microfone.
            5. Inicie o monitoramento!
          files: TVFactChecker_v1.0.8.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
