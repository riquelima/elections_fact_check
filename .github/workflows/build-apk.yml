name: Build TV Fact Checker APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace
          # Encontra o APK gerado e copia com o nome padronizado oficial
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          cp "$APK_FILE" TVFactChecker_v1.0.3.apk
          ls -lh TVFactChecker_v1.0.3.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVFactChecker_v1.0.3
          path: TVFactChecker_v1.0.3.apk
          if-no-files-found: error

      - name: Create GitHub Release (on main/master)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: TV Fact Checker v1.0.3
          body: |
            ## 📺 TV Fact Checker - APK Oficial para Android TV (v1.0.3)
            
            Versão oficial compilada: **TVFactChecker_v1.0.3.apk**
            
            ### Novidades da versão 1.0.3:
            - **Remoção de 'IA Ativa' do Botão Flutuante:** Pílula limpa e discreta, exibindo unicamente o indicador de status (`🎙️ Ouvindo TV...`).
            - **Radar Automático de Notícias:** Dispara checagens factuais ativas periodicamente na TV aberta e GloboNews.
            - **Exibição de Vereditos Verificados:** Suporte a confirmações em verde (`🟢 VERDADEIRO`), alertas em amarelo (`🟡 ENGANOSO`) e vermelho (`🔴 FALSO`).
            
            ### Como instalar na sua TV / uniTV:
            1. Baixe o arquivo **`TVFactChecker_v1.0.3.apk`** abaixo.
            2. Envie para a TV usando o app **Send Files to TV** ou via pendrive USB.
            3. Instale o APK e abra o aplicativo.
            4. Conceda as permissões de sobreposição de tela e microfone.
            5. Inicie o monitoramento!
          files: TVFactChecker_v1.0.3.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
